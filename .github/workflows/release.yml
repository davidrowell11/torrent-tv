# Builds the downloadable apps and attaches them to a GitHub Release.
# Run it from the Actions tab ("Release apps" → Run workflow), or push a tag like v0.2.0.
name: Release apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the release, e.g. 0.2.0'
        required: true
        default: '0.2.0'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Installers carry the release version, so each one upgrades the previous install in place.
      - run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm test
      - run: npm run build:desktop
        env:
          VITE_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          VITE_OMDB_KEY: ${{ secrets.OMDB_API_KEY }}
      - run: npx electron-builder --publish never
        env:
          # Builds are not code-signed yet; see docs/INSTALL.md for opening them.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build && npx cap sync android
        env:
          VITE_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          VITE_OMDB_KEY: ${{ secrets.OMDB_API_KEY }}
      # Sign every release with the same key so a new APK installs over the old one.
      # The key lives in the repository secrets ANDROID_KEYSTORE (base64) and ANDROID_KEYSTORE_PASSWORD.
      - name: Build APK
        working-directory: android
        env:
          VIDORA_VERSION: ${{ env.VERSION }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          VIDORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vidora.jks"
            export VIDORA_KEYSTORE="$RUNNER_TEMP/vidora.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Vidora-android.apk
          else
            echo "::warning::ANDROID_KEYSTORE secret is not set; building a debug APK that cannot update an existing install."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Vidora-android.apk
          fi
      - run: mkdir -p out && mv Vidora-android.apk out/
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/Vidora-android.apk
          if-no-files-found: error

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          name: Vidora ${{ env.VERSION }}
          files: files/*
          body: |
            Downloads for every device. See the install guide: https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md

            | Device | File |
            |---|---|
            | Android phone or tablet | `Vidora-android.apk` |
            | Windows | `Vidora Setup *.exe` |
            | Mac (Apple M1 or newer) | `Vidora-*-arm64.dmg` |
            | Linux / Chromebook (Linux on) | `.deb` or `.AppImage` |

            Or skip downloading and use it in your browser: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
