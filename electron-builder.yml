appId: app.vidora.desktop
productName: Vidora
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
# Native deps here (node-datachannel, utp-native, bufferutil) ship N-API prebuilds that work in Electron as-is.
npmRebuild: false
mac:
  target:
    # Apple Silicon only: native deps are installed for the build machine (arm64),
    # so a universal or Intel build would bundle the wrong binaries.
    - target: dmg
      arch: [arm64]
  category: public.app-category.entertainment
  icon: assets/icon-only.png
win:
  target: [nsis]
  icon: assets/icon-only.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Chromebooks run Linux apps (Crostini), so the .deb / AppImage builds cover them.
linux:
  target: [AppImage, deb]
  category: AudioVideo
  icon: assets/icon-only.png
  maintainer: David Rowell
